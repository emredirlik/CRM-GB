        <style>
            /* PWA Install Banner Styles */
            .pwa-install-banner {
                display: none;
                position: fixed;
                bottom: 70px;
                left: 16px;
                right: 16px;
                background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
                border-radius: 16px;
                padding: 16px;
                box-shadow: 0 10px 40px rgba(0,0,0,0.3);
                z-index: 10000;
                animation: slideUp 0.3s ease-out;
            }
            @keyframes slideUp {
                from { transform: translateY(100px); opacity: 0; }
                to { transform: translateY(0); opacity: 1; }
            }
            .pwa-install-banner.show { display: block; }
            .pwa-banner-content {
                display: flex;
                align-items: center;
                gap: 12px;
            }
            .pwa-banner-icon {
                width: 48px;
                height: 48px;
                border-radius: 12px;
                background: white;
                padding: 4px;
            }
            .pwa-banner-text {
                flex: 1;
            }
            .pwa-banner-title {
                color: white;
                font-weight: 600;
                font-size: 14px;
                margin: 0 0 4px 0;
            }
            .pwa-banner-desc {
                color: #94a3b8;
                font-size: 12px;
                margin: 0;
            }
            .pwa-banner-buttons {
                display: flex;
                gap: 8px;
                margin-top: 12px;
            }
            .pwa-btn-install {
                flex: 1;
                background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
                color: white;
                border: none;
                padding: 10px 16px;
                border-radius: 8px;
                font-weight: 600;
                font-size: 13px;
                cursor: pointer;
            }
            .pwa-btn-close {
                background: transparent;
                color: #94a3b8;
                border: 1px solid #475569;
                padding: 10px 16px;
                border-radius: 8px;
                font-size: 13px;
                cursor: pointer;
            }
            /* iOS Install Instructions */
            .ios-instructions {
                background: #f8fafc;
                border-radius: 8px;
                padding: 12px;
                margin-top: 12px;
            }
            .ios-instructions p {
                color: #334155;
                font-size: 12px;
                margin: 0 0 8px 0;
            }
            .ios-step {
                display: flex;
                align-items: center;
                gap: 8px;
                color: #475569;
                font-size: 11px;
                margin: 4px 0;
            }
        </style>

        <div id="root"></div>
        
        <!-- PWA Install Banner -->
        <div id="pwa-install-banner" class="pwa-install-banner">
            <div class="pwa-banner-content">
                <img src="https://customer-assets.emergentagent.com/job_customer-agent-2/artifacts/wqgvx1bf_Ads%C4%B1z%20tasar%C4%B1m%20%281%29.png" alt="Logo" class="pwa-banner-icon" />
                <div class="pwa-banner-text">
                    <p class="pwa-banner-title">Gewürzberg CRM'i Yükle</p>
                    <p class="pwa-banner-desc">Hızlı erişim için ana ekrana ekle</p>
                </div>
            </div>
            <div id="ios-instructions" class="ios-instructions" style="display:none;">
                <p><strong>Ana Ekrana Eklemek İçin:</strong></p>
                <div class="ios-step">1. Alt menüden <strong>Paylaş</strong> butonuna tıklayın</div>
                <div class="ios-step">2. <strong>"Ana Ekrana Ekle"</strong> seçeneğini seçin</div>
            </div>
            <div class="pwa-banner-buttons">
                <button id="pwa-install-btn" class="pwa-btn-install">Yükle</button>
                <button id="pwa-close-btn" class="pwa-btn-close">Sonra</button>
            </div>
        </div>

        <script>
            // Service Worker Registration
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('/sw.js')
                        .then(reg => console.log('SW registered'))
                        .catch(err => console.log('SW registration failed'));
                });
            }

            // PWA Install Logic
            let deferredPrompt;
            const banner = document.getElementById('pwa-install-banner');
            const installBtn = document.getElementById('pwa-install-btn');
            const closeBtn = document.getElementById('pwa-close-btn');
            const iosInstructions = document.getElementById('ios-instructions');

            // Check if already installed or dismissed
            const isInstalled = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
            const isDismissed = localStorage.getItem('pwa-dismissed');

            // Detect iOS
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

            // Show banner for iOS
            if (isIOS && !isInstalled && !isDismissed) {
                setTimeout(() => {
                    banner.classList.add('show');
                    iosInstructions.style.display = 'block';
                    installBtn.style.display = 'none';
                }, 3000);
            }

            // Listen for beforeinstallprompt (Android/Chrome)
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                
                if (!isInstalled && !isDismissed) {
                    setTimeout(() => {
                        banner.classList.add('show');
                    }, 3000);
                }
            });

            // Install button click
            installBtn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        console.log('PWA installed');
                    }
                    deferredPrompt = null;
                    banner.classList.remove('show');
                }
            });

            // Close button click
            closeBtn.addEventListener('click', () => {
                banner.classList.remove('show');
                localStorage.setItem('pwa-dismissed', 'true');
            });
        </script>
